# Redis + Django web + Celery worker + Celery beat.
# Ollama is expected to run on the HOST (localhost:11434); containers reach it via
# host.docker.internal (see OLLAMA_BASE_URL in .env).

x-django: &django
  build: .
  image: blogermenia:latest
  env_file: .env
  # Bind-mount the repo so code + sqlite db + chroma_db + media are shared live
  # across web/worker/beat and survive rebuilds. (Single-host setup by design:
  # sqlite + on-disk Chroma.)
  volumes:
    - .:/app
  extra_hosts:
    - "host.docker.internal:host-gateway"   # lets Linux containers reach the host's Ollama
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist the queue across restarts
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *django
    # -Ofair + prefetch=1 (in settings) give fair dispatch for slow embedding tasks.
    command: celery -A blogermenia worker --loglevel=info --concurrency=2 -Ofair

  beat:
    <<: *django
    # Scheduler for periodic jobs (the 6-hourly "reindex missing" sweep).
    command: celery -A blogermenia beat --loglevel=info

volumes:
  redis_data:
