
name: blogermenia-dev

x-django: &django
  build: .
  image: blogermenia:dev
  env_file: .env.dev
  # Bind-mount the whole repo so code, db.sqlite3, chroma_db/ and media/ are
  # shared live across web/worker/beat and survive container rebuilds.
  volumes:
    - .:/app
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    # Not published to the host — web/worker/beat reach it as "redis:6379" on
    # the internal compose network. Uncomment below to also poke it from the
    # host (e.g. redis-cli), just pick a free port if 6379 is already taken.
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    restart: unless-stopped

  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    mem_limit: 384m

  worker:
    <<: *django
    # concurrency=1 keeps memory predictable on small hosts; -B embeds beat's
    # scheduler in this same process (see note above) — one less ~300MB process.
    command: celery -A blogermenia worker -B --loglevel=info --concurrency=1 -Ofair
    mem_limit: 384m

  flower:
    <<: *django
    profiles: ["monitoring"]
    command: celery -A blogermenia flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - worker
    mem_limit: 128m

volumes:
  redis_data:
