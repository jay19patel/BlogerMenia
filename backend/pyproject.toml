[project]
name = "backend"
version = "0.1.0"
description = "Blogermenia FastAPI backend — AI blog generation + blog CRUD"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.1",
    "pydantic-settings>=2.14.1",
    # MongoDB
    "motor>=3.7.0",
    # Seeded users must authenticate through the frontend bcrypt login flow
    "bcrypt>=4.2.0",
    # Redis
    "redis>=5.0.0",
    # JWT validation
    "python-jose[cryptography]>=3.3.0",
    # GCS & Image Compression
    "google-cloud-storage>=2.14.0",
    "pillow>=10.2.0",
    "langchain-ollama>=1.1.0",
]
