services:
  # Main Web Service (Django + Gunicorn + WhiteNoise)
  - type: web
    name: blogermenia-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blogermenia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: blogermenia-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"

  # Optional Celery Worker for Background Tasks (Embedding reindexing, etc.)
  - type: worker
    name: blogermenia-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A blogermenia worker --loglevel=info --concurrency=1
    plan: starter
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: blogermenia-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: blogermenia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: blogermenia-redis
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: blogermenia-db
    databaseName: blogermenia
    user: blogermenia_user
    plan: starter
