
name: blogermenia-prod

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-django: &django
  build: .
  image: blogermenia:prod
  env_file: .env.prod
  environment:
    SQLITE_PATH: /app/data/db.sqlite3
  volumes:
    - sqlite_data:/app/data
    - media_data:/app/blogermenia/media
    - chroma_data:/app/blogermenia/search/chroma_db
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  <<: *logging

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    restart: unless-stopped
    <<: *logging

  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn blogermenia.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 60"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m

  worker:
    <<: *django
    # -B embeds beat's scheduler in this process — see note above.
    command: celery -A blogermenia worker -B --loglevel=info --concurrency=1 -Ofair
    mem_limit: 384m

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/blogermenia/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    mem_limit: 24m
    restart: unless-stopped
    <<: *logging

volumes:
  redis_data:
  sqlite_data:
  media_data:
  chroma_data:
