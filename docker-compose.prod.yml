# ============================================================================
# PRODUCTION compose file. Separate from docker-compose.yml on purpose — no
# merging/override rules to remember, this file is the whole picture.
#
#   cp .env.prod.example .env.prod   # fill in real secrets first!
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up --build -d
#
# What's different from dev:
#   - Postgres instead of SQLite
#   - gunicorn instead of the Django dev server (code is baked into the
#     image, not bind-mounted — you rebuild to deploy, you don't live-edit)
#   - nginx in front; it's the ONLY container with a port published to the
#     host (80). Django, Postgres and Redis are only reachable from other
#     containers on the internal compose network.
#   - named volumes instead of bind-mounts, so data survives image rebuilds
#     without depending on the host's folder layout
# ============================================================================

x-django: &django
  build: .
  image: blogermenia:prod
  env_file: .env.prod
  volumes:
    - media_data:/app/blogermenia/media
    - chroma_data:/app/blogermenia/search/chroma_db
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.prod
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn blogermenia.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2"

  worker:
    <<: *django
    command: celery -A blogermenia worker --loglevel=info --concurrency=1 -Ofair

  beat:
    <<: *django
    command: celery -A blogermenia beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/blogermenia/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  chroma_data:
