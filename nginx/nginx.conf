# Production reverse proxy.
#
# Static files are handled by WhiteNoise inside Django/gunicorn (compressed +
# cache-busted), so nginx only has two jobs: serve user-uploaded media
# directly (faster than routing it through Python) and proxy everything else
# to gunicorn.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /media/ {
        alias /app/blogermenia/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
