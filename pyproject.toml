[project]
name = "blogermenia-djnago"
version = "0.1.0"
description = "A sophisticated Django blogging platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2.23",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=3.6.0",
    "django-environ>=0.10.0",
    "django-extensions>=3.2.3",
    "django-filter>=2.4.0",
    "django-storages>=1.12.3",
    "django-user-agents>=0.4.0",
    "django-rq>=2.5.1",
    "django-debug-toolbar>=3.2.1",
    "requests>=2.28.2",
    "Pillow>=11.3.0",
    "psycopg2-binary>=2.9.10",
    "gunicorn>=21.2.0",
    "redis>=4.5.1",
    "label-studio>=1.15.0",
    "celery>=5.2.7",
    "flower>=1.2.0",
    "cryptography>=45.0.7",
    "langchain",
    "langgraph",
    "langchain-mistralai",
    "python-decouple",
    "django-allauth>=0.54.0",
    "google-auth>=2.40.3",
    "uvicorn>=0.32.0",
    "fastapi>=0.115.0",
    "openai>=1.102.0",
    "boto3>=1.40.21"
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=5.13.2"
]
