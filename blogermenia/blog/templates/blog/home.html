{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-lg shadow-sm border border-gray-100 p-12 text-center mt-10">
    <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight sm:text-5xl">
        Welcome to <span class="text-indigo-600">Blogermenia</span>
    </h1>
    <p class="mt-4 max-w-2xl text-xl text-gray-500 mx-auto">
        Your ultimate destination for curated blogs and amazing content.
    </p>
    
    {% if not user.is_authenticated %}
    <div class="mt-8 flex justify-center space-x-4">
        <a href="{% url 'account_signup' %}" class="inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 md:py-4 md:text-lg md:px-10 transition-colors">
            Get started
        </a>
        <a href="{% url 'account_login' %}" class="inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 md:py-4 md:text-lg md:px-10 transition-colors">
            Log in
        </a>
    </div>
    {% else %}
    <div class="mt-8">
        <p class="text-lg text-gray-600">You are logged in! Explore the platform.</p>
    </div>
    {% endif %}
</div>
{% endblock content %}
