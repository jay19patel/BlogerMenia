<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ blog.title }}</title>
<style>
    @page {
        size: A4;
        margin: 2cm;
    }
    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #1e293b;
        line-height: 1.6;
        font-size: 14pt;
    }
    h1 {
        font-size: 28pt;
        font-weight: bold;
        margin-bottom: 0.5rem;
        color: #0f172a;
    }
    .meta {
        font-size: 11pt;
        color: #64748b;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #e2e8f0;
    }
    .cover-image {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 2rem;
    }
    h2 {
        font-size: 20pt;
        margin-top: 2rem;
        color: #0f172a;
    }
    p {
        margin-bottom: 1.5rem;
    }
    pre {
        background-color: #f8fafc;
        padding: 1rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 10pt;
        white-space: pre-wrap;
        word-wrap: break-word;
        border: 1px solid #e2e8f0;
    }
    blockquote {
        border-left: 4px solid #6366f1;
        padding-left: 1rem;
        color: #475569;
        font-style: italic;
        margin-left: 0;
    }
    img {
        max-width: 100%;
        height: auto;
    }
</style>
</head>
<body>

    <h1>{{ blog.title }}</h1>
    
    <div class="meta">
        By {{ blog.author.get_full_name|default:blog.author.username }} &middot; {{ blog.created_at|date:"F d, Y" }}
    </div>

    {% if blog.image %}
    <img src="{{ blog.image.url }}" class="cover-image" alt="Cover Image">
    {% endif %}

    <div class="content">
        {% include "blog/_blog_body.html" %}
    </div>

</body>
</html>
