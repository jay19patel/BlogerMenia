<header class="fixed top-0 left-0 right-0 h-16 border-b border-slate-200 bg-white z-40 flex items-center justify-between px-6">
  <a href="{% url 'home' %}" class="flex items-center gap-2.5">
    <span class="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center shadow-sm shadow-brand-500/30">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    </span>
    <span class="font-bold text-[17px] tracking-tight">Blogermenia</span>
  </a>

  <div class="flex items-center flex-1 max-w-md mx-8">
    <div class="relative w-full">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="global-search" type="text" placeholder="Search articles..." class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 pl-9 pr-14 text-sm text-slate-600 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400 transition-colors">
      <kbd class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] mono text-slate-400 bg-white border border-slate-200 rounded px-1.5 py-0.5 pointer-events-none">⌘K</kbd>
    </div>
  </div>

  {% if user.is_authenticated %}
  <a href="{% url 'user_profile' user.pk %}" class="flex items-center flex-shrink-0">
    {% if user.profile_picture %}
    <img src="{{ user.profile_picture.url }}" alt="{{ user.username }}" class="w-8 h-8 rounded-full object-cover ring-2 ring-transparent hover:ring-brand-500 transition-all">
    {% else %}
    <div class="w-8 h-8 rounded-full bg-brand-100 flex items-center justify-center font-semibold text-brand-700 mono text-xs ring-2 ring-transparent hover:ring-brand-500 transition-all">{{ user.username.0|upper }}</div>
    {% endif %}
  </a>
  {% endif %}
</header>

<script>
(function() {
  function focusSearch() {
    var el = document.getElementById('global-search');
    if (el) { el.focus(); el.select(); }
  }
  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      focusSearch();
    }
  });
})();
</script>
