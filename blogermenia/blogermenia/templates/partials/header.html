<header class="fixed top-0 left-0 right-0 h-16 border-b border-slate-200/80 bg-white/95 backdrop-blur-md z-40 flex items-center justify-between px-6 shadow-sm shadow-slate-100">
  <a href="{% url 'home' %}" class="flex items-center gap-2.5 group">
    <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-purple-600 flex items-center justify-center shadow-md shadow-brand-500/25 group-hover:scale-105 transition-transform duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        <path d="M9 8h6"/>
        <path d="M9 12h4"/>
      </svg>
    </span>
    <span class="font-extrabold text-[19px] tracking-tight text-slate-900 group-hover:text-brand-600 transition-colors">
      Bloger<span class="text-brand-600">Menia</span>
    </span>
  </a>

  <div class="flex items-center flex-1 max-w-md mx-8">
    <div class="relative w-full" id="search-wrap">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="global-search" type="text" autocomplete="off" placeholder="Search blogs, playlists, people..." class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 pl-9 pr-14 text-sm text-slate-600 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-400 transition-colors">
      <kbd class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] mono text-slate-400 bg-white border border-slate-200 rounded px-1.5 py-0.5 pointer-events-none">⌘K</kbd>

      <!-- Results dropdown -->
      <div id="search-results" class="hidden absolute top-full left-0 right-0 mt-2 bg-white border border-slate-200 rounded-xl shadow-xl shadow-slate-200/60 overflow-hidden z-50 max-h-[70vh] overflow-y-auto">
        <div id="search-status" class="px-4 py-3 text-sm text-slate-400"></div>
        <div id="search-list"></div>
      </div>
    </div>
  </div>

  {% if user.is_authenticated %}
  <a href="{% url 'user_profile' user.username %}" class="flex items-center flex-shrink-0">
    {% if user.profile_picture %}
    <img src="{{ user.profile_picture.url }}" alt="{{ user.username }}" class="w-8 h-8 rounded-full object-cover ring-2 ring-transparent hover:ring-brand-500 transition-all">
    {% else %}
    <div class="w-8 h-8 rounded-full overflow-hidden ring-2 ring-transparent hover:ring-brand-500 transition-all [&>svg]:w-full [&>svg]:h-full">{{ user.avatar_svg|safe }}</div>
    {% endif %}
  </a>
  {% endif %}
</header>

<script>
(function() {
  var input = document.getElementById('global-search');
  var wrap = document.getElementById('search-wrap');
  var panel = document.getElementById('search-results');
  var status = document.getElementById('search-status');
  var list = document.getElementById('search-list');
  if (!input) return;

  var ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">';
  var KIND_ICON = {
    blog: ICON_SVG + '<path d="M4 4h11a2 2 0 0 1 2 2v14a1 1 0 0 1-1.4.9L12 19l-3.6 1.9A1 1 0 0 1 7 20V6a2 2 0 0 0-2-2z"/><path d="M8 7h6M8 11h6"/></svg>',
    playlist: ICON_SVG + '<path d="M3 6h13M3 12h13M3 18h9"/><path d="M18 12l4 2.5-4 2.5z"/></svg>',
    profile: ICON_SVG + '<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>'
  };

  function focusSearch() { input.focus(); input.select(); }

  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); focusSearch(); }
    if (e.key === 'Escape') { hide(); input.blur(); }
  });

  function show() { panel.classList.remove('hidden'); }
  function hide() { panel.classList.add('hidden'); }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function thumb(r) {
    if (r.image_url) {
      return '<div class="w-9 h-9 rounded-lg overflow-hidden bg-slate-100 flex-shrink-0">' +
             '<img src="' + r.image_url + '" class="w-full h-full object-cover" alt=""></div>';
    }
    return '<div class="w-9 h-9 rounded-lg overflow-hidden bg-slate-100 flex-shrink-0 [&>svg]:w-full [&>svg]:h-full">' +
           (r.icon_html || '') + '</div>';
  }

  function render(results) {
    if (!results.length) {
      list.innerHTML = '';
      status.textContent = 'No matches found.';
      status.classList.remove('hidden');
      return;
    }
    status.classList.add('hidden');
    list.innerHTML = results.map(function(r) {
      var icon = KIND_ICON[r.kind] || '';
      var liIcon = (r.posted_on_linkedin && r.linkedin_post_url) ? ' <span class="inline-flex text-[#0A66C2] align-middle ml-1"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg></span>' : '';
      return '<a href="' + r.url + '" class="flex items-center gap-3 px-4 py-2.5 hover:bg-slate-50 transition-colors border-b border-slate-50 last:border-0">' +
        thumb(r) +
        '<div class="min-w-0 flex-1">' +
          '<p class="text-sm font-semibold text-slate-800 truncate">' + escapeHtml(r.title) + liIcon + '</p>' +
          '<p class="text-xs text-slate-400 truncate">' + escapeHtml(r.subtitle) + '</p>' +
        '</div>' +
        '<span class="text-slate-400 flex-shrink-0" title="' + escapeHtml(r.label) + '">' + icon + '</span>' +
      '</a>';
    }).join('');
  }

  var timer = null, lastQuery = null, controller = null;

  function runSearch(q) {
    if (controller) controller.abort();
    controller = new AbortController();
    status.textContent = 'Searching...';
    status.classList.remove('hidden');
    show();
    fetch('{% url "search_api" %}?q=' + encodeURIComponent(q), { signal: controller.signal })
      .then(function(res) { return res.json(); })
      .then(function(data) { if (data.query === input.value.trim()) render(data.results); })
      .catch(function(err) { if (err.name !== 'AbortError') { status.textContent = 'Search unavailable.'; } });
  }

  input.addEventListener('input', function() {
    var q = input.value.trim();
    clearTimeout(timer);
    if (q.length < 2) { hide(); lastQuery = null; return; }
    if (q === lastQuery) { show(); return; }
    lastQuery = q;
    timer = setTimeout(function() { runSearch(q); }, 250);
  });

  input.addEventListener('focus', function() {
    if (input.value.trim().length >= 2 && list.innerHTML) show();
  });

  document.addEventListener('click', function(e) {
    if (!wrap.contains(e.target)) hide();
  });
})();
</script>
