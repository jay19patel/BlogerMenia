<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Request path through edge cache, application cache and database">
  <rect width="720" height="300" fill="#F8FAFC"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="24" y="110" width="130" height="80" rx="14" fill="#ffffff" stroke="#E2E8F0"/>
    <text x="89" y="145" font-size="15" font-weight="600" fill="#0F172A">Client</text>
    <text x="89" y="166" font-size="12" fill="#64748B">browser</text>

    <rect x="204" y="110" width="130" height="80" rx="14" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="269" y="140" font-size="15" font-weight="600" fill="#4338CA">Edge cache</text>
    <text x="269" y="161" font-size="12" fill="#6366F1">TTL 30s</text>
    <text x="269" y="178" font-size="12" fill="#6366F1">hit rate 71%</text>

    <rect x="384" y="110" width="130" height="80" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="449" y="140" font-size="15" font-weight="600" fill="#047857">App cache</text>
    <text x="449" y="161" font-size="12" fill="#059669">Redis, TTL 5m</text>
    <text x="449" y="178" font-size="12" fill="#059669">hit rate 22%</text>

    <rect x="564" y="110" width="130" height="80" rx="14" fill="#ffffff" stroke="#E2E8F0"/>
    <text x="629" y="145" font-size="15" font-weight="600" fill="#0F172A">Postgres</text>
    <text x="629" y="166" font-size="12" fill="#64748B">7% of reads</text>

    <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M154 150 H196"/>
      <path d="M334 150 H376"/>
      <path d="M514 150 H556"/>
    </g>
    <text x="360" y="60" font-size="13" fill="#475569">Each layer answers what it can and forwards the rest</text>
    <text x="360" y="252" font-size="13" fill="#475569">Invalidation travels the other way: Postgres write &#8594; app cache purge &#8594; edge purge</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
